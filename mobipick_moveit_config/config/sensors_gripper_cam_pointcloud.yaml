# This file configures MoveIt's PointCloudOctomapUpdater. Both supported
# updaters build the same planning-scene octomap; this one consumes the
# registered PointCloud2 produced by the camera pipeline.

sensors:
  - sensor_plugin: occupancy_map_monitor/PointCloudOctomapUpdater
    point_cloud_topic: eef_main_cam/depth_registered/points
    max_range: 1.0
    max_update_rate: 1.0
    frame_subsample: 1
    point_subsample: 1
    padding_offset: 0.1
    padding_scale: 1.0
    # Debug output after MoveIt filters robot links, attached bodies and
    # registered collision objects. Keep it enabled while validating octomap
    # integration; it adds some processing overhead.
    filtered_cloud_topic: filtered_cloud
