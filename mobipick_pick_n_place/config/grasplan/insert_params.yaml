# TODO: merge some? of this params with the one in "grasp_planning_core_params.yaml"

# the list of names of the gripper joint
gripper_joint_names:
    - mobipick/gripper_finger_joint

# the list of max torque values to apply while opening the gripper after inserting
gripper_joint_efforts:
    - 30.0

# the distance between the gripper fingers such that the object is released
gripper_release_distance: 0.12 # 0.1 is not sufficient for multimeter for some reason... however it should

# Keep obstacles outside the current camera view while inserting.
# Enable only as a diagnostic/workaround for stale octomap data.
clear_octomap: False

# default: empty list, a list of arm poses to visit before inserting an object to disentangle the cable
disentangle_required: True
poses_to_go_before_insert:
    - 'untangle_cable_guide_1_right'
    - 'untangle_cable_guide_2_right'

# insert_orientation: how the held object is turned over the container; all are read on every insert goal, so
# they can be changed at runtime with rosparam set:
# - as_picked: the object keeps the orientation it was grasped in (the container's yaw, or 8 fixed yaws on the
#   second attempt); after an oblique AnyGrasp grasp this can turn the wrist by 180-210 deg (#103, #106)
# - free_yaw: the object keeps the roll and pitch it was picked with, its yaw about the vertical is chosen for
#   the least wrist rotation from where it is (after the untangle poses); any object size (#106). With
#   insert_sort_by_ik (default true) the yaws are tried in the order of the wrist_3 change an IK solution
#   needs; in the sim that kept wrist_3 within 15-35 deg instead of 177-197 deg for as_picked
# - gripper_down: objects whose collision box is at most comfortable_orientation_max_size long (balls, fruit)
#   are released with the gripper pointing straight down and the wrist turned as little as possible; changes
#   the object's roll and pitch after an oblique grasp
# - '' (empty): place_same_orientation_as_picked decides, true: as_picked, false: gripper_down
# free_yaw is the default for sim and real since 2026-09-28 (#106); tables_demo_bringup's launch arg
# insert_orientation (default free_yaw) overrides this value
insert_orientation: free_yaw
place_same_orientation_as_picked: True
comfortable_orientation_max_size: 0.15
