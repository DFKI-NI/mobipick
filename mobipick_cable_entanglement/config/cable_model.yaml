# Cable model of the Mobipick arm (see doc/cable_model.md). Lengths in m, angles in degrees.
#
# The anchors and carrier positions come from mobipick_description/urdf/cable_guide/cable_guide.urdf.xacro (the
# triflex R size 30 carrier, igus UR clamps TR-911-965-xxx); the free lengths are best guesses from the data we had
# on 2026-09-26 (scripts/calibrate_cable_model.py) and must be refined on the real robot.

tf_prefix: "mobipick/"
base_link: ur5_base_link
cable_carrier_radius: 0.01725

# the cable is assumed untangled here (joint_limits.yaml: "home ... where the cables are least stretched")
reference_pose_deg: {shoulder_pan: 0.0, shoulder_lift: -149.0, elbow: 139.2, wrist_1: -117.5, wrist_2: -90.0, wrist_3: 179.9}
# a housing holds the cable only when both span ends are level with it (extent along the joint axis, joint frame,
# plus this margin); neutral_deg: joint angle at which the cable takes the short way around the joint (fixes the
# winding branch; the UR joint angles are absolute, so extra turns stay in the model).
extent_margin: 0.02

# which deciding start the spans with a support_start use: carrier_tip (the calibrated start of the day before),
# support, or auto = support in the sim (/use_sim_time) and carrier_tip on the real robot until tested there; the global
# ROS parameter /cable_model/wrist_anchor (carrier_tip | support) overrides auto. Offline scripts and tests:
# carrier_tip.
wrist_anchor: auto

spans:
  # (oscar 2026-09-30): only the wrist span ever entangled; the shoulder and elbow spans are kept but off by default
  # (not computed at all). `enabled` here; the ROS parameter cable_model/span_<name> (monitor launch args wrist_span,
  # elbow_span, shoulder_span) overrides it.
  # forearm carrier (wrist end) -> terminal element carrier on wrist_3; crosses wrist_1, wrist_2, wrist_3.
  # This is the loop over the wrist in the photo and where every entanglement so far happened.
  wrist:
    enabled: true
    start: {link: cable_guide_forearm_tube_link, xyz: [0, 0, -0.15], direction: [0, 0, -1]}
    end: {link: cable_guide_wrist_3_tube_link, xyz: [0, 0, -0.04], direction: [0, 0, -1]}
    free_length: 0.43   # best guess, see doc 'Calibration': taut just past the wrist_3=30 / wrist_1=0 limits of the home family
    # the simulated carrier (the carrier_* keys: the carrier link chain in RViz, videos, collisions; their names are
    # older than
    # the removal of the radius rope, 2026-09-30) uses the measured carrier: 0.48 m free from the edge of the
    # last forearm bracket (Oscar, tape measure, 2026-09-28; the 30 cm URDF guide link reaches 5.5 cm beyond it).
    # The deciding geometry above stays until the calibration session: with the measured one, 4 poses just
    # before the real stops of 2026-09-27 17:58 / 18:32 looked 3-19 points more slack and the MTC guard would pass them.
    carrier_start: {link: cable_guide_forearm_tube_link, xyz: [0, 0, -0.095], direction: [0, 0, -1]}
    # (oscar 2026-09-30): the carrier is clamped in the terminal element; the URDF's 8 cm guide link (z -0.04 tip
    # .. +0.04 base, the element's centre) is MoveIt's mockup of the carrier. The carrier, the carrier link chain and
    # RViz end at
    # the element's face (z +0.027; a pin at its centre would sit inside the element's collision shape), leaving
    # along -z as before until someone measures the direction. The deciding `end` above stays at the tip until a refit
    # on the real evidence (it feeds the geometry-only stretch and the MTC guard margin).
    carrier_end: {link: cable_guide_wrist_3_tube_link, xyz: [0, 0, 0.027], direction: [0, 0, -1]}
    # (oscar 2026-09-30): 0.48 m (tape) was "too tight" in RViz (taut at home with the shapes fitted to the
    # meshes, carrier link chain strain 2 %), 0.56 m "too much" (the loop hung well below wrist_1, the real one stays
    # closer):
    # 0.52 m, the middle and the shortest length that is slack on every route. The
    # carrier's
    # length along its centre line is still to be measured.
    carrier_free_length: 0.52
    # the deciding start at the real carrier support (the edge of the last forearm bracket, where the carrier
    # starts),
    # not at the tip of the URDF guide link, which is longer than the supported section for MoveIt clearance. Used with
    # wrist_anchor 'support' (below). Its free length is an effective string length refit on the real evidence of
    # 2026-09-27/28 (a scan over the logged real stops; the tape-measure 0.48 m
    # would leave every real stop slack): at the MTC guard margin -0.115 it catches the five known taut poses (E1, E2,
    # E4 at the stop, E3 and T1 one second before; carrier tip 0.43: E2 only), E4 with 3 points of margin, for about
    # 1 % (claude-7e2a's everyday ticks; 5 % of mine) instead of 0.4 % (3.5 %) of everyday poses above the margin, and
    # no new stops at the named poses (they get slacker). E5? and the stop instants of E3/T1 stay slack.
    support_start: {link: cable_guide_forearm_tube_link, xyz: [0, 0, -0.095], direction: [0, 0, -1]}
    support_free_length: 0.45
    # untangled, the wrist carrier hangs on the wrist_1 cap side of the arm, in front of the cap (Oscar's photo at home,
    # 2026-09-28; the start straight down went over the top of the wrist); the forearm link's -z points to that side.
    # The carrier ended where the URDF's 8 cm wrist_3 guide link ends until : with the old camera capsule (5 cm too
    # big) a carrier end in the terminal element touched it, which the carrier replay took for a caught loop on 32 of
    # 255
    # real motions of 2026-09-27 (every move to observe; ). With the shapes fitted to the meshes it ends in the
    # terminal element (carrier_end below); the decision diff of checks those motions again.
    carrier_rest_side: {link: ur5_forearm_link, direction: [0, 0, -1]}
    lead: 0.03
    stiffness: 2000.0
    confidence: medium
    wrap_joints:
      - {joint: ur5_wrist_1_joint, radius: 0.045, extent: [-0.14, 0.05], neutral_deg: -90.0}
      - {joint: ur5_wrist_2_joint, radius: 0.045, extent: [-0.14, 0.05], neutral_deg: 0.0}
      - {joint: ur5_wrist_3_joint, radius: 0.042, extent: [-0.17, 0.25], neutral_deg: 165.7}
  # upper arm carrier (elbow end) -> forearm carrier (elbow end); crosses the elbow
  elbow:
    enabled: false
    start: {link: cable_guide_upper_arm_tube_link, xyz: [0, 0, -0.15], direction: [0, 0, -1]}
    end: {link: cable_guide_forearm_tube_link, xyz: [0, 0, 0.15], direction: [0, 0, 1]}
    # (oscar 2026-09-30: the free carrier starts at the support edges, not at the guide link tips): the carrier,
    # the
    # carrier link chain and RViz run from the elbow-side edge of the upper arm carrier's clamp2 bracket (z -0.1215) to
    # the
    # elbow-side edge of the forearm carrier's clamp3 bracket (z +0.1065): URDF bracket centre -/+ 6.5 mm along the
    # carrier,
    # the rule that matched oscar's tape at the wrist start within 4 mm. The carrier keeps its slack: its length
    # grows by the carrier between tip and edge (0.0285 + 0.0435 m). The deciding start / end / free_length stay.
    carrier_start: {link: cable_guide_upper_arm_tube_link, xyz: [0, 0, -0.1215], direction: [0, 0, -1]}
    carrier_end: {link: cable_guide_forearm_tube_link, xyz: [0, 0, 0.1065], direction: [0, 0, 1]}
    carrier_free_length: 0.472
    # untangled, the elbow carrier runs around the outside of the elbow, past the joint's end (oscar's photo at
    # home, media/cable/reliable/mobipick_in_home_pose.jpeg); a start straight down put it between upper arm and
    # forearm, where the shapes fitted to the meshes leave it no room at home (elbow folded 140 deg)
    carrier_rest_side: {link: ur5_upper_arm_link, direction: [-1, 0, 0]}
    free_length: 0.40   # the full elbow range needs <= 0.37
    lead: 0.03
    stiffness: 2000.0
    confidence: medium
    wrap_joints:
      - {joint: ur5_elbow_joint, radius: 0.058, extent: [-0.05, 0.20], neutral_deg: 0.0}
  # pedestal -> upper arm carrier (shoulder end); crosses shoulder_pan and shoulder_lift.
  # The pedestal exit is NOT in the URDF: guessed from the photo, low confidence.
  shoulder:
    enabled: false
    start: {link: ur5_base_link, xyz: [-0.10, 0.14, -0.05], direction: [0, 0, 1]}
    end: {link: cable_guide_upper_arm_tube_link, xyz: [0, 0, 0.15], direction: [0, 0, 1]}
    # the carrier's end at the shoulder-side edge of the upper arm carrier's clamp1 bracket (z +0.1065, same rule
    # as
    # the elbow span); its start stays at the guessed pedestal exit (no bracket data); length + 0.0435 m (slack kept)
    carrier_end: {link: cable_guide_upper_arm_tube_link, xyz: [0, 0, 0.1065], direction: [0, 0, 1]}
    carrier_free_length: 0.5435
    free_length: 0.50   # low confidence (pedestal exit guessed); named poses need <= 0.445
    lead: 0.03
    stiffness: 2000.0
    confidence: low
    wrap_joints:
      - {joint: ur5_shoulder_pan_joint, radius: 0.075, extent: [-0.20, 0.10], neutral_deg: 0.0}
      - {joint: ur5_shoulder_lift_joint, radius: 0.065, extent: [-0.07, 0.20], neutral_deg: -90.0}

# obstacles for the carrier link chain (radius without the carrier radius, which the model adds). Measured from the UR5
# collision
# meshes, the Robotiq FT300 / 2F-140 meshes and the Astra box of the URDF. tool: true = a loop held there is "hooked".
capsules:
  # (2026-09-30, oscar: "use cylinders", boxes where box-shaped, tight to the URDF collision meshes, fingers open):
