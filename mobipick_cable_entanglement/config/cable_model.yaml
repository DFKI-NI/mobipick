# the simulated carrier: the carrier link chain (; the radius rope was removed on 2026-09-30, it caught none of the
# real cable
# stops). enabled false = the geometric check alone (no chain, no history).
cable_carrier:
  enabled: true
  segment_length: 0.03    # node spacing of the coarse copy whose holds give the chain's length
  substeps: 2             # with damping: the damping per 0.1 s
  damping: 0.08
  contact_tolerance: 0.006
  tighten_iterations: 40  # relaxation steps before the string pull (slack slides off, real holds stay)
  evaluate_every: 3       # chain lengths recomputed every n-th update (the chain itself steps every update)
  decide_on_topology: false  # true: wraps of the chain around the housings also decide (not calibrated yet)
  max_dt: 0.1
  link_chain:
    # approximations (Oscar, 2026-09-30): the real carrier still has to be measured in the lab. Neighbouring
    # discs touch at 2*atan(gap / diameter) = 16.3 deg per joint = a 3.5 cm bend radius of the centre line.
    disc_height: 0.005     # thickness of a disc along the carrier
    disc_gap: 0.005        # free space between two discs on a straight carrier (height + gap = the link pitch)
    disc_diameter: 0.035
    substeps: 100          # per update: a chain of short links needs small steps to keep its length
    passes: 2              # constraint passes per substep
    gravity: 9.81
    clamp_taper: 0.1       # how fast a capsule regains its thickness away from a clamp that sits inside it
    friction: 0.3          # of the carrier on the arm and tool capsules (a guess; 0 = it slides freely)
    # the links cannot stretch: a chain pulled longer than it is counts as that much stretch of its span, so
    # decision.stop_stretch predicts the protective stop for a carrier pulled taut along the way it lies
    decide_on_strain: true
    strain_tolerance: 0.01   # strain below this is the solver's own slack and says nothing
    twist_per_link_deg: 10.0   # torsion stop per link (igus triflex R catalogue); the twist is logged, never decides
    # a reset (the MTC guard: one per path) reuses the chain settled at an earlier reset at the same pose, every
    # joint rounded to this step [mrad] (a near repeat is glided to the exact pose); 0 = off. Careful flag, off in the
    # code; ROS parameter cable_model/reset_cache_mrad
    reset_cache_mrad: 0.0

decision:
  warn_stretch: -0.04    # less than 4 % slack left -> warning
  stop_stretch: 0.02     # 2 % over-stretched -> protective stop predicted even without a torque estimate
  stop_torque:           # extra joint torque [Nm] at which we predict the UR protective stop (guess)
    shoulder_pan: 15.0
    shoulder_lift: 15.0
    elbow: 10.0
    wrist_1: 4.0
    wrist_2: 4.0
    wrist_3: 4.0
  entangled_ticks: 2     # consecutive predictions before the level is "entangled"
  # false = the carrier link chain alone decides (the geometric string stays out of the monitor's decision and the MTC
  # guard's path replay; the guard's geometric margin stage stays); ROS parameter cable_model/geometric_check
  # (monitor launch arg geometric_check) overrides it (oscar's test of the carrier link chain in isolation, 2026-09-30)
  geometric_check: true
